name: Validate contributed studies

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-studies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::readr
            any::dplyr
            any::STAVE

      - name: Validate public studies
        run: |
          Rscript -e 'source("R/build_stave_object.R"); build_stave_object(include_private = FALSE)'
