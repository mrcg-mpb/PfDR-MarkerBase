name: Validate contributed studies

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-studies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "remotes",
            "yaml",
            "readr",
            "dplyr"
          ), repos = "https://cloud.r-project.org")'

          Rscript -e 'remotes::install_github("mrc-ide/STAVE", ref = "v2.0.2")'

      - name: Validate public studies
        run: |
          echo "Building STAVE object..."
          Rscript -e 'source("R/build_stave_object.R"); build_stave_object(include_private = FALSE)'
          echo "Validation completed successfully."